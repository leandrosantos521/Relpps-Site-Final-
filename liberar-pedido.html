<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Liberar pedido | Relpps</title><link rel="stylesheet" href="./styles.css"></head><body style="background:#faf8f4"><main class="container"><div class="admin-card"><img class="sales-logo-full" src="./assets/relpps-logo-vendas-preta.png" alt="Relpps Cosméticos"><h1>Liberar pedido para Uber</h1><p>Use somente no ambiente interno da Relpps. O segredo não deve ser compartilhado com clientes.</p><label>Número do pedido<input id="order" placeholder="REL-..."></label><label>Senha de liberação<input id="secret" type="password" autocomplete="off"></label><button class="btn btn-gold full" id="go">LIBERAR PEDIDO</button><p id="msg" class="status-muted"></p></div></main><script>document.querySelector('#go').onclick=async()=>{const b=document.querySelector('#go'),m=document.querySelector('#msg');b.disabled=true;b.textContent='LIBERANDO…';try{const r=await fetch('/.netlify/functions/checkout?action=release',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({order:document.querySelector('#order').value.trim(),secret:document.querySelector('#secret').value})});const d=await r.json();if(!r.ok)throw new Error(d.message||'Falha');m.textContent=`Pedido ${d.order.id} liberado para Uber.`}catch(e){m.textContent=e.message}finally{b.disabled=false;b.textContent='LIBERAR PEDIDO'}}</script></body></html>
