<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pedido | Relpps Cosméticos</title><link rel="icon" href="./assets/logo.png"><link rel="stylesheet" href="./styles.css"></head><body style="background:#faf8f4"><main class="container"><div class="order-status-card"><img class="sales-logo-full" src="./assets/relpps-logo-vendas-preta.png" alt="Relpps Cosméticos"><span class="status-pill" id="statusPill">PEDIDO</span><h1 id="statusTitle">Consultando pedido…</h1><p id="statusText" class="status-muted">Aguarde enquanto consultamos o status.</p><div class="status-info" id="statusInfo"></div><div class="status-actions" id="statusActions"></div></div></main><script>
const $=s=>document.querySelector(s);const id=new URLSearchParams(location.search).get('order');const money=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(v)||0);const wa=t=>`https://wa.me/5561996498557?text=${encodeURIComponent(t)}`;
function esc(v){return String(v??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]))}
async function load(){if(!id){$('#statusTitle').textContent='Pedido não informado';return}try{const r=await fetch(`/.netlify/functions/checkout?action=status&order=${encodeURIComponent(id)}`,{cache:'no-store'});const d=await r.json();if(!r.ok)throw new Error(d.message||'Pedido não encontrado');const o=d.order||d;const method=o.delivery?.method;const fulfillment=o.fulfillmentStatus||'';$('#statusPill').textContent=o.paymentStatus==='APPROVED'?'PAGAMENTO APROVADO':'AGUARDANDO PAGAMENTO';let title='Aguardando pagamento';let text='Seu pedido foi registrado e está aguardando a confirmação do pagamento.';if(method==='pickup'&&o.paymentStatus==='AWAITING_PAYMENT'){title='AGUARDANDO PAGAMENTO';text='Seu pedido foi reservado. O pagamento será feito em dinheiro no momento da retirada.'}else if(method==='pickup_uber'&&o.paymentStatus!=='APPROVED'){title='AGUARDANDO PAGAMENTO';text='Após o pagamento aprovado, a Relpps fará a liberação para retirada via Uber.'}else if(method==='pickup_uber'&&fulfillment==='Aguardando liberação da loja'){title='AGUARDANDO LIBERAÇÃO';text='Pagamento aprovado. Agora a Relpps precisa separar e liberar seu pedido para o Uber.'}else if(method==='pickup_uber'&&fulfillment==='Liberado para Uber'){title='PEDIDO LIBERADO';text='Seu pedido está liberado. Você já pode solicitar o Uber para retirar na Relpps.'}else if(method==='pickup_uber'&&fulfillment==='Uber solicitado'){title='UBER SOLICITADO';text='A entrega via Uber foi solicitada. Acompanhe pelo link abaixo.'}else if(o.paymentStatus==='APPROVED'){title='PAGAMENTO APROVADO';text='Seu pagamento foi confirmado e o pedido está liberado para a próxima etapa.'}$('#statusTitle').textContent=title;$('#statusText').textContent=text;const addr='Quadra C 12, Área Especial 02, Loja 30 — Taguatinga Centro, Brasília - DF — CEP 72010-901';$('#statusInfo').innerHTML=`<p><b>Pedido:</b> ${esc(o.id)}</p><p><b>Total:</b> ${money(o.totals?.total)}</p>${method==='pickup'||method==='pickup_uber'?`<p><b>Retirada:</b> ${method==='pickup_uber'?'Via Uber após liberação':'Presencial'}</p><p><b>Local:</b> ${addr}</p>`:''}${o.uber?.tracking_url?`<p><b>Acompanhamento:</b> <a href="${esc(o.uber.tracking_url)}" target="_blank" rel="noopener">Abrir rastreamento do Uber</a></p>`:''}`;let buttons='';if(method==='pickup'&&o.paymentStatus==='AWAITING_PAYMENT')buttons+=`<a class="btn btn-gold" href="https://www.google.com/maps/search/?api=1&query=Relpps%20Cosm%C3%A9ticos%20C%2012%20AE%2002%20Loja%2030%20Taguatinga%20Centro%20Bras%C3%ADlia%20DF%2072010-901" target="_blank">ABRIR LOCALIZAÇÃO</a>`;if(method==='pickup_uber'&&o.paymentStatus==='APPROVED'&&fulfillment==='Liberado para Uber'&&!o.uber?.delivery_id)buttons+=`<button class="btn btn-gold" id="uberBtn">SOLICITAR UBER</button>`;buttons+=`<a class="btn btn-dark" href="${wa(`Olá! Preciso de suporte sobre o pedido ${o.id}.`)}" target="_blank">WHATSAPP (61) 99649-8557</a>`;$('#statusActions').innerHTML=buttons;$('#uberBtn')?.addEventListener('click',async()=>{const b=$('#uberBtn');b.disabled=true;b.textContent='SOLICITANDO…';const rr=await fetch(`/.netlify/functions/checkout?action=request-uber`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({order:id})});const dd=await rr.json();if(!rr.ok){alert(dd.message||'Não foi possível solicitar o Uber.');b.disabled=false;b.textContent='SOLICITAR UBER';return}load()});}catch(e){$('#statusTitle').textContent='Não foi possível consultar';$('#statusText').textContent=e.message} }
load();setInterval(()=>load(),10000);
</script></body></html>
