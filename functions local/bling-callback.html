<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conectando ao Bling | Relpps</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f3ec;color:#342820;font-family:Arial,sans-serif}.box{width:min(92%,520px);padding:44px;background:#fff;border:1px solid #e6ddd0;box-shadow:0 20px 70px rgba(52,40,32,.12);text-align:center}.spinner{width:38px;height:38px;margin:0 auto 24px;border:3px solid #eadfce;border-top-color:#b98b3e;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}h1{font-family:Georgia,serif;font-size:32px;margin:0 0 10px}p{color:#776d65;line-height:1.6}.ok{color:#55724d}.error{color:#9b4b43}.btn{display:inline-block;margin-top:20px;padding:13px 22px;background:#342820;color:#fff;text-decoration:none;border-radius:2px}
  </style>
</head>
<body>
  <main class="box">
    <div class="spinner" id="spinner"></div>
    <h1 id="title">Conectando ao Bling</h1>
    <p id="message">Aguarde. Estamos finalizando a conexão segura.</p>
  </main>
<script>
(async function(){
  const params=new URLSearchParams(location.search);
  const code=params.get('code');
  const state=params.get('state');
  const error=params.get('error');
  const title=document.getElementById('title');
  const message=document.getElementById('message');
  const spinner=document.getElementById('spinner');
  if(error){
    spinner.style.display='none'; title.textContent='Conexão cancelada'; message.className='error'; message.textContent=params.get('error_description')||'O Bling não autorizou a conexão.'; return;
  }
  if(!code||!state){
    spinner.style.display='none'; title.textContent='Não foi possível conectar'; message.className='error'; message.textContent='O Bling não retornou o código de autorização. Inicie a conexão novamente.'; return;
  }
  try{
    const r=await fetch('/api/bling?action=callback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code,state})});
    const data=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(data.message||'Falha ao concluir a autorização.');
    spinner.style.display='none'; title.textContent='Bling conectado'; message.className='ok'; message.textContent='A conexão foi concluída com sucesso. Você já pode voltar para a loja.';
    const a=document.createElement('a'); a.className='btn'; a.href='/index.html#produtos'; a.textContent='Voltar para a loja'; document.querySelector('.box').appendChild(a);
  }catch(e){
    spinner.style.display='none'; title.textContent='Erro na conexão'; message.className='error'; message.textContent=e.message;
  }
})();
</script>
</body>
</html>
