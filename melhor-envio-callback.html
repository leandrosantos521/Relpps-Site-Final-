<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conectando Melhor Envio | Relpps</title><link rel="stylesheet" href="./styles.css"></head><body class="pickup-page"><main class="pickup-shell"><div class="pickup-card"><img class="sales-logo-full" src="./assets/relpps-logo-vendas-preta.png" alt="Relpps Cosméticos"><span class="eyebrow">MELHOR ENVIO</span><h1 id="title">Conectando sua conta…</h1><p id="text">Estamos salvando a autorização com segurança.</p><a class="btn btn-gold" href="./index.html">VOLTAR PARA A LOJA</a></div></main><script>const q=new URLSearchParams(location.search);const title=document.querySelector('#title'),text=document.querySelector('#text');async function run(){if(q.get('error')){title.textContent='Autorização cancelada';text.textContent=q.get('error_description')||q.get('error');return}const code=q.get('code'),state=q.get('state');if(!code||!state){title.textContent='Código não encontrado';text.textContent='Volte para a loja e inicie a autorização novamente.';return}try{const r=await fetch('/api/shipping?action=oauth-callback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code,state})});const d=await r.json();if(!r.ok)throw new Error(d.message||'Não foi possível autorizar.');title.textContent='Melhor Envio conectado ✓';text.textContent='A conta foi autorizada. Agora o checkout pode consultar as cotações em tempo real.'}catch(e){title.textContent='Não foi possível conectar';text.textContent=e.message}}run();</script></body></html>
