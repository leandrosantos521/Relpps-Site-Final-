<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Retirada | Relpps Cosméticos</title><link rel="icon" href="./assets/logo.png"><link rel="stylesheet" href="./styles.css"></head><body class="pickup-page"><main class="pickup-shell"><div class="pickup-card"><a href="./index.html" class="pickup-brand"><img src="./assets/relpps-logo-vendas-preta.png" alt="Relpps Cosméticos"></a><span class="eyebrow">RELPPS COSMÉTICOS</span><h1>Retirada do pedido</h1><p id="pickupText">Consultando o pedido…</p><div class="pickup-address"><img src="./assets/relpps-store-front.jpg" alt="Fachada da Relpps Cosméticos"><div><b>📍 Relpps Cosméticos</b><p>C 12, Área Especial 02, Loja 30<br>Taguatinga Centro, Brasília — DF<br>CEP 72010-901</p><a href="https://www.google.com/maps/search/?api=1&query=Relpps%20Cosm%C3%A9ticos%20C%2012%20AE%2002%20Loja%2030%20Taguatinga%20Centro%20Bras%C3%ADlia%20DF%2072010-901" target="_blank" rel="noopener">ABRIR LOCALIZAÇÃO ↗</a></div></div><div id="pickupActions" class="pickup-actions"></div></div></main><script>
const id=new URLSearchParams(location.search).get('order');const $=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function load(){if(!id){$('#pickupText').textContent='Pedido não informado.';return}try{const r=await fetch(`/.netlify/functions/checkout?action=status&order=${encodeURIComponent(id)}`,{cache:'no-store'});const d=await r.json();if(!r.ok)throw new Error(d.message||'Pedido não encontrado');const o=d.order||d;const paid=o.paymentStatus==='APPROVED';const uber=o.delivery?.method==='pickup_uber';if(uber&&paid&&o.fulfillmentStatus==='Liberado para Uber'){$('#pickupText').innerHTML='Seu pedido está <b>liberado</b>. Escolha Uber ou 99 para fazer a retirada por sua conta.';$('#pickupActions').innerHTML='<a class="btn btn-dark" href="https://m.uber.com/ul/" target="_blank" rel="noopener">🛵 ABRIR UBER</a><a class="btn btn-dark" href="https://99app.com/" target="_blank" rel="noopener">🚗 ABRIR 99</a>'}else if(paid){$('#pickupText').innerHTML='Seu pedido está <b>reservado</b>. Apresente o número do pedido na loja para retirar.';$('#pickupActions').innerHTML='<a class="btn btn-gold" href="./pedido.html?order='+encodeURIComponent(id)+'">VER STATUS DO PEDIDO</a>'}else{$('#pickupText').innerHTML='Seu pedido ainda aguarda pagamento. Depois da confirmação, esta página mostrará a situação da retirada.'}}catch(e){$('#pickupText').textContent=e.message}}load();setInterval(load,8000);
</script></body></html>
