<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pedido | Relpps Cosméticos</title><link rel="icon" href="./assets/logo.png"><link rel="stylesheet" href="./styles.css"></head><body style="background:#faf8f4"><main class="container"><div class="order-status-card"><img class="sales-logo-full" src="./assets/relpps-logo-vendas-preta.png" alt="Relpps Cosméticos"><span class="status-pill" id="statusPill">PEDIDO</span><h1 id="statusTitle">Consultando pedido…</h1><p id="statusText" class="status-muted">Aguarde enquanto consultamos o status.</p><div class="status-info" id="statusInfo"></div><div class="status-actions" id="statusActions"></div></div></main><script>
const $=s=>document.querySelector(s);const id=new URLSearchParams(location.search).get('order');const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const storeAddress='C 12, Área Especial 02, Loja 30 — Taguatinga Centro, Brasília - DF — CEP 72010-901';
const storeMaps='https://www.google.com/maps/search/?api=1&query=Relpps%20Cosm%C3%A9ticos%20C%2012%20AE%2002%20Loja%2030%20Taguatinga%20Centro%20Bras%C3%ADlia%20DF%2072010-901';
function wa(t){return `https://wa.me/5561996498557?text=${encodeURIComponent(t)}`}
function appLink(kind){
  if(kind==='uber') return 'https://m.uber.com/ul/';
  return 'https://99app.com/';
}
function statusModel(o){
  const method=o.delivery?.method; const freight=o.freight||o.delivery?.shipping||{}; const fp=o.freightPayment||{}; const paid=o.paymentStatus==='APPROVED';
  if(method==='uber'){
    if(paid && freight?.paid) return {pill:'PEDIDO CONFIRMADO',title:'Pedido confirmado',text:'Pagamento confirmado. A entrega pode ser preparada pela Relpps.',tone:'success'};
    if(freight?.price>0 && fp?.payment_url) return {pill:'FRETE CALCULADO',title:'Frete calculado — falta pagar',text:'A Relpps lançou o valor do Uber Entregas. Pague o valor total abaixo para confirmar seu pedido.',tone:'gold'};
    return {pill:'AGUARDANDO FRETE',title:'Aguardando cotação do Uber',text:'Seu pedido já foi criado. A Relpps vai informar o valor da entrega. Quando o frete for lançado, o botão de pagamento aparecerá aqui.',tone:'pending'};
  }
  if(method==='pickup_uber'){
    if(paid && o.fulfillmentStatus==='Liberado para Uber') return {pill:'LIBERADO',title:'Pedido liberado para Uber / 99',text:'A loja liberou seu pedido. Agora você pode solicitar Uber ou 99 por sua conta para fazer a retirada.',tone:'success'};
    if(paid) return {pill:'PEDIDO RESERVADO',title:'Pedido reservado',text:'Pagamento confirmado. Aguarde a loja liberar o pedido para solicitar Uber ou 99.',tone:'gold'};
    return {pill:'AGUARDANDO PAGAMENTO',title:'Aguardando pagamento',text:'Depois do pagamento aprovado, o pedido ficará reservado e aguardará a liberação da loja.',tone:'pending'};
  }
  if(method==='pickup'){
    if(paid) return {pill:'PEDIDO RESERVADO',title:'Pedido reservado para retirada',text:'Pagamento confirmado. Seu pedido está reservado para retirada na loja.',tone:'success'};
    if(o.paymentMethod==='cash') return {pill:'AGUARDANDO RETIRADA',title:'Retirada com pagamento em dinheiro',text:'Seu pedido não está reservado. Vá à loja para retirar e pagar em dinheiro.',tone:'pending'};
  }
  if(paid) return {pill:'PAGAMENTO APROVADO',title:'Pedido confirmado',text:'Pagamento confirmado. Seu pedido foi liberado para preparação.',tone:'success'};
  return {pill:'AGUARDANDO PAGAMENTO',title:'Aguardando pagamento',text:'Seu pedido foi registrado e aguarda a confirmação do pagamento.',tone:'pending'};
}
async function load(){
  if(!id){$('#statusTitle').textContent='Pedido não informado';return}
  try{
    const r=await fetch(`/.netlify/functions/checkout?action=status&order=${encodeURIComponent(id)}`,{cache:'no-store'});const d=await r.json();if(!r.ok)throw new Error(d.message||'Pedido não encontrado');const o=d.order||d;
    const model=statusModel(o);$('#statusPill').textContent=model.pill;$('#statusTitle').textContent=model.title;$('#statusText').textContent=model.text;
    const freight=o.freight||o.delivery?.shipping||{}; const shipping=Number(freight?.price||o.totals?.shipping||0); const total=Number(o.totals?.total||0); const subtotal=Number(o.totals?.subtotal||0);
    const addr=o.delivery?.cep?`<p><b>CEP:</b> ${esc(o.delivery.cep)}</p><p><b>Endereço:</b> ${esc(o.delivery.address||'')}, ${esc(o.delivery.number||'')}${o.delivery.complement?` — ${esc(o.delivery.complement)}`:''}</p><p><b>Bairro:</b> ${esc(o.delivery.district||'')}</p><p><b>Cidade/UF:</b> ${esc(o.delivery.city||'')}</p>`:'';
    let html=`<p><b>Pedido:</b> ${esc(o.id)}</p><p><b>Produtos:</b> ${money(subtotal)}</p>${shipping>0?`<p><b>Frete:</b> ${money(shipping)} — ${esc(freight.label||'Entrega')}</p>`:`<p><b>Frete:</b> ${isUberPending(o)?'A calcular':'Grátis'}</p>`}<p><b>Total atual:</b> ${money(total)}</p>`;
    if(o.delivery?.method==='pickup'||o.delivery?.method==='pickup_uber') html+=`<div class="pickup-location-box"><b>📍 Local de retirada</b><p>${esc(storeAddress)}</p><a href="${storeMaps}" target="_blank" rel="noopener">ABRIR LOCALIZAÇÃO</a></div>`; else html+=addr;
    $('#statusInfo').innerHTML=html;
    const actions=$('#statusActions');let buttons='';
    const pay=o.paymentUrl||o.freightPayment?.payment_url;
    if(pay) buttons+=`<a class="btn btn-gold" href="${esc(pay)}">PAGAR ${shipping>0?'PEDIDO':'PEDIDO'} — ${money(total)}</a>`;
    if(o.delivery?.method==='pickup' && o.paymentStatus==='APPROVED') buttons+=`<a class="btn btn-dark" href="${storeMaps}" target="_blank" rel="noopener">📍 COMO CHEGAR À LOJA</a>`;
    if(o.delivery?.method==='pickup_uber' && o.paymentStatus==='APPROVED' && o.fulfillmentStatus==='Liberado para Uber') buttons+=`<a class="btn btn-dark" href="${appLink('uber')}" target="_blank" rel="noopener">🛵 ABRIR UBER</a><a class="btn btn-dark" href="${appLink('99')}" target="_blank" rel="noopener">🚗 ABRIR 99</a>`;
    if(o.paymentStatus==='APPROVED' && (o.delivery?.method!=='uber' || freight?.paid)){
      const itemsText=Array.isArray(o.items)&&o.items.length?o.items.map(i=>`${i.quantity||i.qty||1}x ${i.name||i.descricao||'Produto'}`).join('\n'):'';
      const addressText=o.delivery?.cep?`CEP: ${o.delivery.cep}\nEndereço: ${o.delivery.address||''}, ${o.delivery.number||''}${o.delivery.complement?` — ${o.delivery.complement}`:''}\nBairro: ${o.delivery.district||''}\nCidade/UF: ${o.delivery.city||''}`:'';
      const txt=`Olá! Confirmo meu pedido ${o.id}.\nProdutos: ${money(subtotal)}\nFrete: ${shipping?money(shipping):'Grátis'}\nTotal: ${money(total)}\n${itemsText?`Itens:\n${itemsText}\n`:''}${addressText?`${addressText}\n`:''}Pagamento confirmado. Por favor, confirme meu pedido.`;
      buttons+=`<a class="btn btn-dark" href="${wa(txt)}" target="_blank" rel="noopener">WHATSAPP — CONFIRMAR PEDIDO</a>`;
    }
    actions.innerHTML=buttons;
  }catch(e){$('#statusTitle').textContent='Não foi possível consultar';$('#statusText').textContent=e.message}
}
function isUberPending(o){return o.delivery?.method==='uber'&&!Number((o.freight||o.delivery?.shipping||{}).price||0)}
load();setInterval(load,8000);
</script></body></html>
