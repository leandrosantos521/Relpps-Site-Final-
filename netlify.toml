[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/bling/*"
  to = "/.netlify/functions/bling"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/api/shipping/*"
  to = "/.netlify/functions/shipping"
  status = 200

[[redirects]]
  from = "/api/checkout/*"
  to = "/.netlify/functions/checkout"
  status = 200

[[redirects]]
  from = "/api/shipping"
  to = "/.netlify/functions/shipping"
  status = 200

[[redirects]]
  from = "/api/checkout"
  to = "/.netlify/functions/checkout"
  status = 200
