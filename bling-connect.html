<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bling | Relpps</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f3ec;color:#342820;font-family:Arial,sans-serif}.box{width:min(92%,500px);padding:45px;background:#fff;text-align:center;border:1px solid #e5dccf;box-shadow:0 20px 70px #34282014}h1{font:600 38px Georgia,serif;margin:0 0 12px}.logo{width:70px;height:70px;object-fit:contain;margin-bottom:18px}p{color:#756b63;line-height:1.6}.btn{display:inline-block;margin:18px 7px 0;padding:14px 24px;border:0;text-decoration:none;cursor:pointer;font-weight:700}.primary{background:#342820;color:#fff}.secondary{background:#eee7dd;color:#342820}.status{margin-top:18px;font-size:14px}</style></head><body><main class="box"><img class="logo" src="./assets/logo.png" alt="Relpps"><h1>Conexão com o Bling</h1><p>Conecte o catálogo da Relpps ao seu Bling para testar produtos e estoque localmente.</p><a class="btn primary" href="/api/bling?action=authorize">CONECTAR AO BLING</a><button class="btn secondary" id="disconnect">DESCONECTAR</button><div class="status" id="status">Verificando conexão...</div></main><script>async function status(){const r=await fetch('/api/bling?action=status');const d=await r.json();document.getElementById('status').textContent=d.connected?'● Bling conectado com sucesso.':'○ Bling ainda não conectado.'}status();document.getElementById('disconnect').onclick=async()=>{await fetch('/api/bling?action=disconnect');status()};</script></body></html>
