<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Frete / liberar pedido | Relpps</title><link rel="stylesheet" href="./styles.css"></head><body style="background:#faf8f4"><main class="container"><div class="admin-card"><img class="sales-logo-full" src="./assets/relpps-logo-vendas-preta.png" alt="Relpps Cosméticos"><span class="eyebrow">PAINEL RELPPS</span><h1>Liberação de frete e pedido</h1><p>Use somente internamente. Para <b>Uber Entregas</b>, coloque o valor do frete no Bling e depois sincronize aqui. O cliente verá o total e o botão de pagamento.</p><label>Número do pedido<input id="order" placeholder="REL-..."></label><label>Senha de liberação<input id="secret" type="password" autocomplete="off"></label><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px"><a class="btn btn-dark" href="./conectar-melhor-envio.html">CONECTAR MELHOR ENVIO</a><button class="btn btn-gold" id="syncUber">LER FRETE DO BLING E LIBERAR PAGAMENTO</button></div><div id="msg" class="status-muted" style="margin-top:16px"></div></div></main><script>
const $=s=>document.querySelector(s);const money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const creds=()=>({order:$('#order').value.trim(),secret:$('#secret').value});
async function api(action,body){const r=await fetch(`/.netlify/functions/checkout?action=${action}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.message||'Falha');return d;}
$('#syncUber').onclick=async()=>{const b=$('#syncUber'),m=$('#msg');b.disabled=true;b.textContent='LENDO BLING…';m.textContent='';try{const d=await api('sync-uber-freight',creds());m.innerHTML=`Frete do Bling: <b>${money(d.order.freight.price)}</b><br>Total para o cliente: <b>${money(d.order.totals.total)}</b><br><br>${d.paymentUrl?`<a href="${d.paymentUrl}" target="_blank" rel="noopener">Abrir pagamento InfinitePay</a>`:'Modo de teste: sem link de pagamento.'}`}catch(e){m.textContent=e.message}finally{b.disabled=false;b.textContent='LER FRETE DO BLING E LIBERAR PAGAMENTO'}};
</script></body></html>
